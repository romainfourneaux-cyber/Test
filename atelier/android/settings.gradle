// Le domaine : application Android qui embarque le jeu de révision (jeu/) hors ligne.
// Ordre des dépôts : Google (AGP, AndroidX), puis le miroir Google de Maven Central,
// puis Maven Central lui-même en dernier (il répond parfois 429 à l'adresse du conteneur ; voir CHAINE.md).
pluginManagement {
    repositories {
        google()
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        mavenCentral()
    }
}
rootProject.name = "le-domaine"
include ":app"
