org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true
# Proxy du conteneur, en repli si JAVA_TOOL_OPTIONS venait à manquer. Le bloc entre les deux repères est récrit
# à chaque passage de atelier/outils/construire-apk.sh d'après HTTPS_PROXY (le port change d'une session à l'autre) ;
# sans HTTPS_PROXY, le bloc est vidé : la machine parle directement aux dépôts.
# --- proxy (écrit par construire-apk.sh) ---
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=37191
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.javax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts
systemProp.javax.net.ssl.trustStoreType=JKS
# --- fin proxy ---
