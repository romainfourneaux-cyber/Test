<title>Maquette extension R+1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  /* Plein écran : la maquette occupe tout le fond, un cartouche d'architecte en haut, les vues en bas. */
  :root {
    --paper: #f3f1ec;          /* surfaces UI, ton enduit Weber 001 */
    --paper-glass: rgba(243, 241, 236, 0.88);
    --ink: #22272a;            /* texte, dérivé RAL 7016 */
    --ink-soft: #5c6266;
    --accent: #383e42;         /* RAL 7016 : vue active */
    --accent-ink: #f3f1ec;
    --placo: #8fa9bc;          /* repère "placo" */
    --mark: #c0392b;           /* repères numérotés du détail */
    --line: rgba(34, 39, 42, 0.14);
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --font-body: 'Barlow', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1d2124; --paper-glass: rgba(29, 33, 36, 0.86); --ink: #ece6d8; --ink-soft: #a9a59b;
      --accent: #ece6d8; --accent-ink: #1d2124; --placo: #9db7ca; --mark: #e0604f; --line: rgba(236, 230, 216, 0.16); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1d2124; --paper-glass: rgba(29, 33, 36, 0.86); --ink: #ece6d8; --ink-soft: #a9a59b;
    --accent: #ece6d8; --accent-ink: #1d2124; --placo: #9db7ca; --mark: #e0604f; --line: rgba(236, 230, 216, 0.16); color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; width: 100%; height: 100%; }

  .ui { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 2;
        padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .ui > * { pointer-events: auto; }
  .top { top: 0; padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .bottom { bottom: 0; padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 12px); display: grid; gap: 8px; }
  body.walking .ui, body.walking #marks, body.touring .ui, body.touring #marks { display: none; }
  .tourbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: none; align-items: center; gap: 12px;
             padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); }
  body.touring .tourbar { display: flex; }
  .tourbar .prog { flex: 1; height: 3px; background: var(--line); overflow: hidden; }
  .tourbar .prog i { display: block; height: 100%; width: 0%; background: var(--ink); }
  .tourbar .lbl { font: 600 13px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
  #veil { position: fixed; inset: 0; background: #0e1012; opacity: 0; pointer-events: none; z-index: 3; }
  #ptCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; display: none; }
  body.touring.perso #ptCanvas { display: block; }

  .glass { background: var(--paper-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); }
  .cartouche { padding: 10px 14px 11px; max-width: min(460px, 100%); min-width: 0; }
  .cartouche .kicker { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .cartouche h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; letter-spacing: 0.01em; text-wrap: balance; }
  .cartouche p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.35; color: var(--ink-soft); }
  .cartouche ol { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; line-height: 1.3;
                  max-height: 34vh; overflow-y: auto; }
  .cartouche ol li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; }
  .num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--mark); color: #fff;
         font: 600 12px/1 var(--font-display); }
  .linkbtn { margin-top: 6px; background: none; border: 0; padding: 0; color: var(--ink); font: 600 13px var(--font-body); text-decoration: underline; cursor: pointer; }

  .legend { padding: 8px 12px; display: grid; gap: 5px; font-size: 12.5px; }
  .legend .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .sw { width: 14px; height: 14px; border: 1px solid var(--line); flex: none; }
  .sw.weber { background: #ece6d8; } .sw.ral { background: #383e42; } .sw.placo { background: #c9d9e6; }

  .rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .rail::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em;
          padding: 9px 13px; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip.walk { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip:focus-visible, .tog:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--placo); outline-offset: 2px; }
  .tog { flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 7px 11px; color: var(--ink); cursor: pointer; }
  .tog .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
  .tog[aria-pressed="true"] .dot { background: var(--ink); border-color: var(--ink); }
  .tog.placo[aria-pressed="true"] .dot { background: var(--placo); border-color: var(--placo); }

  #marks { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  #marks .num { position: absolute; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(255,255,255,.85); }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; background: var(--paper); transition: opacity .5s; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading .box { text-align: center; font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-size: 14px; }
  .loading .bar { width: 160px; height: 2px; background: var(--line); margin: 12px auto 0; overflow: hidden; }
  .loading .bar i { display: block; height: 100%; width: 40%; background: var(--ink); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .loading .bar i { animation: none; width: 100%; } }
  @media (max-width: 640px) {
    .legend { display: none; }
    .cartouche h1 { font-size: 19px; }
    .cartouche p { font-size: 12.5px; }
    .cartouche ol { max-height: 26vh; font-size: 12.5px; }
  }
</style>

<div id="scene" aria-label="Maquette 3D de l'extension, faire glisser pour tourner"></div>
<div id="marks" aria-hidden="true"></div>

<div class="ui top">
  <div class="cartouche glass">
    <div class="kicker">Extension R+1 · visuel non coté</div>
    <h1 id="viewTitle">Façade jardin</h1>
    <p id="viewCaption">Chargement…</p>
    <ol id="notes" hidden></ol>
    <button class="linkbtn" id="notesBtn" hidden aria-expanded="false" aria-controls="notes">Afficher la légende</button>
  </div>
  <div class="legend glass" aria-label="Matériaux">
    <div class="row"><span class="sw weber"></span>Enduit Weber 001 blanc cassé</div>
    <div class="row"><span class="sw ral"></span>Menuiseries et escalier RAL 7016</div>
    <div class="row"><span class="sw placo"></span>Doublages et cloisons placo</div>
  </div>
</div>

<div class="ui bottom">
  <div class="rail" id="views" role="toolbar" aria-label="Vues"></div>
  <div class="rail" role="toolbar" aria-label="Affichage">
    <button class="tog glass" id="t-mobilier" aria-pressed="true"><span class="dot"></span>Mobilier</button>
    <button class="tog glass" id="t-etage" aria-pressed="true"><span class="dot"></span>Étage</button>
    <button class="tog glass" id="t-toit" aria-pressed="true"><span class="dot"></span>Toiture</button>
    <button class="tog glass placo" id="t-placo" aria-pressed="false"><span class="dot"></span>Repérer le placo</button>
    <button class="tog glass" id="t-hd" aria-pressed="false"><span class="dot"></span>Ombres douces</button>
  </div>
</div>

<canvas id="ptCanvas" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>
<div class="tourbar" role="region" aria-label="Visite guidée">
  <div class="glass" style="padding:8px 12px"><span class="lbl" id="tourLbl">Visite guidée</span></div>
  <div class="prog glass" aria-hidden="true"><i id="tourProg"></i></div>
  <button class="chip glass" id="tourStop">Arrêter</button>
</div>

<div class="loading" id="loading"><div class="box">Montage de la maquette<div class="bar"><i></i></div></div></div>

<script type="module">
  import { createApp, VIEWS } from './src/app.js';
  const $ = (id) => document.getElementById(id);
  const app = await createApp($('scene'), { interactive: true, quality: 'auto' });

  // ---- Vues --------------------------------------------------------------------------------
  const order = ['ext-ouest', 'ext-est', 'axo-rdc', 'coupe-escalier', 'int-degagement', 'int-wc',
                 'detail-fixation', 'detail-echiffre', 'detail-raccord', 'etage'];
  const rail = $('views');
  const chips = {};
  for (const key of order) {
    const v = VIEWS[key]; if (!v) continue;
    const b = document.createElement('button');
    b.className = 'chip glass'; b.id = 'v-' + key; b.textContent = v.label; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => go(key));
    rail.appendChild(b); chips[key] = b;
  }
  let lastView = 'ext-ouest';
  function go(key, animate = true) {
    const v = VIEWS[key]; if (!v) return;
    lastView = key;
    app.setView(key, { animate });
    for (const [k, b] of Object.entries(chips)) b.setAttribute('aria-pressed', String(k === key));
    $('viewTitle').textContent = v.label;
    $('viewCaption').textContent = v.caption;
    chips[key]?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: animate ? 'smooth' : 'auto' });
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    refreshNotes();
  }

  // ---- Repères numérotés des vues de détail ------------------------------------------------
  const marks = $('marks');
  let notesOpen = !matchMedia('(max-width: 640px)').matches;
  function refreshNotes() {
    const list = app.projectCallouts ? app.projectCallouts(app.state.view, { occlusion: false }) : [];
    const shown = list.filter((c) => c.view === app.state.view);
    $('notesBtn').hidden = shown.length === 0;
    $('notes').hidden = shown.length === 0 || !notesOpen;
    $('notesBtn').textContent = notesOpen ? 'Masquer la légende' : `Afficher la légende (${shown.length})`;
    $('notesBtn').setAttribute('aria-expanded', String(notesOpen));
    $('notes').innerHTML = shown.map((c, i) => `<li><span class="num">${i + 1}</span><span>${c.text}</span></li>`).join('');
    placeMarks();
  }
  function placeMarks() {
    if (!app.projectCallouts) return;
    const list = app.projectCallouts(app.state.view, { occlusion: false }).filter((c) => c.view === app.state.view);
    marks.innerHTML = list.map((c, i) => (c.visible ? `<span class="num" style="left:${c.x}px;top:${c.y}px">${i + 1}</span>` : '')).join('');
  }
  $('notesBtn').addEventListener('click', () => { notesOpen = !notesOpen; refreshNotes(); });
  if (app.onFrame) {
    let last = '';
    app.onFrame(() => {
      const c = app.camera.matrixWorld.elements;
      const key = app.state.view + c[12].toFixed(3) + c[13].toFixed(3) + c[14].toFixed(3) + c[8].toFixed(3) + c[10].toFixed(3);
      if (key !== last) { last = key; placeMarks(); }
    });
  }

  // ---- Affichage ---------------------------------------------------------------------------
  const toggle = (id, fn) => $(id).addEventListener('click', (e) => {
    const b = e.currentTarget; const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on)); fn(on); app.requestRender?.();
  });
  toggle('t-mobilier', (on) => app.setToggle('furniture', on));
  toggle('t-etage', (on) => app.setToggle('etage', on));
  toggle('t-toit', (on) => app.setToggle('roof', on));
  toggle('t-placo', (on) => app.setPlacoHighlight(on));
  toggle('t-hd', (on) => app.setAO(on));
  $('t-hd').setAttribute('aria-pressed', String(app.ao));

  // ---- Visite 3D à la première personne (src/walk.js) --------------------------------------
  const { createWalk } = await import('./src/walk.js');
  const walk = createWalk({
    THREE: app.THREE, camera: app.camera, renderer: app.renderer, scene: app.scene, model: app.model,
    domElement: app.renderer.domElement, controls: app.controls,
    autoUpdate: typeof app.onFrame !== 'function',
    onExit: () => { document.body.classList.remove('walking'); go(lastView, false); },
  });
  if (typeof app.onFrame === 'function') app.onFrame((dt) => walk.update(dt));
  async function startWalk(spot = 'sas') {
    for (const id of ['t-etage', 't-toit']) if ($(id).getAttribute('aria-pressed') === 'false') $(id).click();
    document.body.classList.add('walking');
    marks.innerHTML = '';
    app.setView(VIEWS.visite ? 'visite' : 'int-degagement', { animate: false });
    try { history.replaceState(null, '', '#visite'); } catch (e) {}
    await walk.enter(spot);
  }
  const walkChip = document.createElement('button');
  walkChip.className = 'chip glass walk'; walkChip.id = 'v-visite3d'; walkChip.textContent = 'Visite 3D';
  walkChip.addEventListener('click', () => startWalk());
  rail.prepend(walkChip);

  // ---- Visite guidée automatique (src/tour.js) : la caméra se promène et ouvre les portes ----
  const { createTour } = await import('./src/tour.js');
  const tour = createTour({ THREE: app.THREE, app });
  const veil = $('veil');
  let tourOff = null, current = null;
  function endTour() {
    tourOff?.(); tourOff = null;
    current?.stop(); current = null;
    veil.style.opacity = 0;
    document.body.classList.remove('touring', 'perso');
    go(lastView, false);
  }
  function startTour(t = tour, { label = 'Visite guidée', hash = 'visite-guidee', frame = null } = {}) {
    if (walk.isActive?.()) walk.exit();
    if (current) endTour();
    for (const id of ['t-mobilier', 't-etage', 't-toit']) if ($(id).getAttribute('aria-pressed') === 'false') $(id).click();
    document.body.classList.add('touring');
    $('tourLbl').textContent = label;
    marks.innerHTML = '';
    try { history.replaceState(null, '', '#' + hash); } catch (e) {}
    current = t;
    t.play({ ended: endTour });
    tourOff = app.onFrame(() => {
      veil.style.opacity = t.fade(t.time).toFixed(3);
      $('tourProg').style.width = `${(100 * t.time / t.duration).toFixed(1)}%`;
      frame?.(t.time);
    });
  }
  $('tourStop').addEventListener('click', endTour);
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && current?.playing) endTour(); });
  const tourChip = document.createElement('button');
  tourChip.className = 'chip glass walk'; tourChip.id = 'v-visite-guidee'; tourChip.textContent = 'Visite guidée';
  tourChip.addEventListener('click', () => startTour());
  walkChip.after(tourChip);

  // ---- Visite avec personnage (src/person.js) : silhouette, largeurs de passage, cotes ------
  let person = null;
  const ptCanvas = $('ptCanvas'), ptCtx = ptCanvas.getContext('2d');
  async function startPerson() {
    if (!person) {
      $('loading').classList.remove('done');
      const [{ createPersonTour }, { drawPersonOverlay }] = await Promise.all([import('./src/person.js'), import('./src/person-hud.js')]);
      person = { tour: await createPersonTour({ THREE: app.THREE, app }), draw: drawPersonOverlay };
      $('loading').classList.add('done');
    }
    document.body.classList.add('perso');
    startTour(person.tour, {
      label: 'Visite avec personnage', hash: 'visite-personnage',
      frame: (time) => {
        const dpr = Math.min(2, devicePixelRatio || 1), w = innerWidth, h = innerHeight;
        if (ptCanvas.width !== Math.round(w * dpr) || ptCanvas.height !== Math.round(h * dpr)) { ptCanvas.width = Math.round(w * dpr); ptCanvas.height = Math.round(h * dpr); }
        ptCtx.clearRect(0, 0, ptCanvas.width, ptCanvas.height);
        person.draw(ptCtx, person.tour.overlay(time), {
          THREE: app.THREE, camera: app.camera, W: ptCanvas.width, H: ptCanvas.height,
          scale: dpr * Math.min(1.1, Math.max(0.72, w / 1280)), legendBottom: 64 * dpr,
        });
      },
    });
  }
  const personChip = document.createElement('button');
  personChip.className = 'chip glass walk'; personChip.id = 'v-visite-personnage'; personChip.textContent = 'Visite avec personnage';
  personChip.addEventListener('click', startPerson);
  tourChip.after(personChip);

  const start = (location.hash || '').slice(1);
  if (start === 'visite') { go('ext-ouest', false); startWalk(); }
  else if (start === 'visite-guidee') { go('ext-ouest', false); startTour(); }
  else if (start === 'visite-personnage') { go('ext-ouest', false); await startPerson(); }
  else go(VIEWS[start] ? start : 'ext-ouest', false);
  $('loading').classList.add('done');
</script>
