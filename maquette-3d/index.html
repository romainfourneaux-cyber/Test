<title>Maquette extension R+1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  /* Plein écran : la maquette occupe tout le fond, un cartouche d'architecte en haut, les vues en bas. */
  :root {
    --paper: #f3f1ec;          /* surfaces UI, ton enduit Weber 001 */
    --paper-glass: rgba(243, 241, 236, 0.86);
    --ink: #22272a;            /* texte, dérivé RAL 7016 */
    --ink-soft: #5c6266;
    --accent: #383e42;         /* RAL 7016 : vue active */
    --accent-ink: #f3f1ec;
    --placo: #8fa9bc;          /* repère "placo" */
    --line: rgba(34, 39, 42, 0.14);
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --font-body: 'Barlow', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1d2124; --paper-glass: rgba(29, 33, 36, 0.84); --ink: #ece6d8; --ink-soft: #a9a59b;
      --accent: #ece6d8; --accent-ink: #1d2124; --placo: #9db7ca; --line: rgba(236, 230, 216, 0.16); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1d2124; --paper-glass: rgba(29, 33, 36, 0.84); --ink: #ece6d8; --ink-soft: #a9a59b;
    --accent: #ece6d8; --accent-ink: #1d2124; --placo: #9db7ca; --line: rgba(236, 230, 216, 0.16); color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; width: 100%; height: 100%; }

  .ui { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 2;
        padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .ui > * { pointer-events: auto; }
  .top { top: 0; padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .bottom { bottom: 0; padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 12px); display: grid; gap: 8px; }

  .cartouche { background: var(--paper-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
               border: 1px solid var(--line); padding: 10px 14px 11px; max-width: min(460px, 100%); min-width: 0; }
  .cartouche .kicker { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .cartouche h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; letter-spacing: 0.01em; text-wrap: balance; }
  .cartouche p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.35; color: var(--ink-soft); }

  .legend { background: var(--paper-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line); padding: 8px 12px; display: grid; gap: 5px; font-size: 12.5px; }
  .legend .row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .sw { width: 14px; height: 14px; border: 1px solid var(--line); flex: none; }
  .sw.weber { background: #ece6d8; } .sw.ral { background: #383e42; } .sw.placo { background: #c9d9e6; }

  .rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .rail::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em;
          padding: 9px 13px; border: 1px solid var(--line); background: var(--paper-glass); color: var(--ink);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip:focus-visible, .tog:focus-visible { outline: 2px solid var(--placo); outline-offset: 2px; }
  .tog { flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; padding: 7px 11px;
         border: 1px solid var(--line); background: var(--paper-glass); color: var(--ink); cursor: pointer;
         backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .tog .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
  .tog[aria-pressed="true"] .dot { background: var(--ink); border-color: var(--ink); }
  .tog.placo[aria-pressed="true"] .dot { background: var(--placo); border-color: var(--placo); }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; background: var(--paper); transition: opacity .5s; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading .box { text-align: center; font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-size: 14px; }
  .loading .bar { width: 160px; height: 2px; background: var(--line); margin: 12px auto 0; overflow: hidden; }
  .loading .bar i { display: block; height: 100%; width: 40%; background: var(--ink); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .loading .bar i { animation: none; width: 100%; } }
  @media (max-width: 640px) {
    .legend { display: none; }
    .cartouche h1 { font-size: 19px; }
    .cartouche p { font-size: 12.5px; }
  }
</style>

<div id="scene" aria-label="Maquette 3D de l'extension, faire glisser pour tourner"></div>

<div class="ui top">
  <div class="cartouche">
    <div class="kicker">Extension R+1 · visuel non coté</div>
    <h1 id="viewTitle">Façade jardin</h1>
    <p id="viewCaption">Chargement…</p>
  </div>
  <div class="legend" aria-label="Matériaux">
    <div class="row"><span class="sw weber"></span>Enduit Weber 001 blanc cassé</div>
    <div class="row"><span class="sw ral"></span>Menuiseries alu RAL 7016</div>
    <div class="row"><span class="sw placo"></span>Doublages et cloisons placo</div>
  </div>
</div>

<div class="ui bottom">
  <div class="rail" id="views" role="toolbar" aria-label="Vues"></div>
  <div class="rail" role="toolbar" aria-label="Affichage">
    <button class="tog" id="t-mobilier" aria-pressed="true"><span class="dot"></span>Mobilier</button>
    <button class="tog" id="t-etage" aria-pressed="true"><span class="dot"></span>Étage</button>
    <button class="tog" id="t-toit" aria-pressed="true"><span class="dot"></span>Toiture</button>
    <button class="tog placo" id="t-placo" aria-pressed="false"><span class="dot"></span>Repérer le placo</button>
    <button class="tog" id="t-hd" aria-pressed="false"><span class="dot"></span>Ombres douces</button>
  </div>
</div>

<div class="loading" id="loading"><div class="box">Montage de la maquette<div class="bar"><i></i></div></div></div>

<script type="module">
  import { createApp, VIEWS } from './src/app.js';
  const $ = (id) => document.getElementById(id);
  const app = await createApp($('scene'), { interactive: true, quality: 'auto' });

  const order = ['ext-ouest', 'ext-est', 'axo-rdc', 'coupe-escalier', 'int-degagement', 'int-wc', 'etage'];
  const rail = $('views');
  const chips = {};
  for (const key of order) {
    const v = VIEWS[key]; if (!v) continue;
    const b = document.createElement('button');
    b.className = 'chip'; b.id = 'v-' + key; b.textContent = v.label; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => go(key));
    rail.appendChild(b); chips[key] = b;
  }
  function go(key, animate = true) {
    const v = VIEWS[key]; if (!v) return;
    app.setView(key, { animate });
    for (const [k, b] of Object.entries(chips)) b.setAttribute('aria-pressed', String(k === key));
    $('viewTitle').textContent = v.label;
    $('viewCaption').textContent = v.caption;
    chips[key]?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: animate ? 'smooth' : 'auto' });
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
  }

  const toggle = (id, fn) => $(id).addEventListener('click', (e) => {
    const b = e.currentTarget; const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on)); fn(on);
  });
  toggle('t-mobilier', (on) => app.setToggle('furniture', on));
  toggle('t-etage', (on) => app.setToggle('etage', on));
  toggle('t-toit', (on) => app.setToggle('roof', on));
  toggle('t-placo', (on) => app.setPlacoHighlight(on));
  toggle('t-hd', (on) => app.setAO(on));
  $('t-hd').setAttribute('aria-pressed', String(app.ao));

  const start = (location.hash || '').slice(1);
  go(VIEWS[start] ? start : 'ext-ouest', false);
  $('loading').classList.add('done');
</script>
